name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Force single-threaded BLAS (determinism)
        run: |
          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "NUMEXPR_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "VECLIB_MAXIMUM_THREADS=1" >> "$GITHUB_ENV"

      - name: Lint (compile + ruff)
        run: |
          python -m py_compile dagforge/*.py dagforge/*/*.py
          pip install ruff || true
          ruff check dagforge tests || true

      - name: Test
        run: python -m pytest -q

      - name: Demo smoke (reproducibility)
        run: python -m dagforge.examples.run_demo --output benchmark.json --seed 42
